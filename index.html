  <div id="app"></div>

  <!-- Pantalla de alarma (equivale a AlarmActivity) -->
  <section id="alarm" class="alarm" hidden role="alertdialog" aria-modal="true" aria-labelledby="alarm-name">
    <div class="alarm-inner">
      <p class="alarm-kicker" id="alarm-kicker"></p>
      <div class="alarm-orb"><svg><use href="#i-pill"/></svg></div>
      <h1 class="alarm-name" id="alarm-name"></h1>
      <p class="alarm-dose" id="alarm-dose"></p>
      <p class="alarm-notes" id="alarm-notes"></p>
      <p class="alarm-msg" id="alarm-msg"></p>
      <p class="alarm-sound-hint" id="alarm-sound-hint" hidden></p>
      <div class="alarm-actions">
        <button class="btn-taken" id="alarm-taken" type="button"></button>
        <button class="btn-snooze" id="alarm-snooze" type="button"></button>
        <button class="btn-dismiss" id="alarm-dismiss" type="button"></button>
      </div>
      <p class="alarm-queue" id="alarm-queue" hidden></p>
    </div>
  </section>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="i18n.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
